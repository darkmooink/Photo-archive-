<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Archive</title>
    <style>
      :root {
        --bg: #f5f0e6;
        --panel: #fffaf2;
        --text: #2f241d;
        --muted: #6d5b4d;
        --accent: #8c4b2f;
        --accent-2: #c17b47;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        background: radial-gradient(circle at 10% 10%, #fff3dc, var(--bg) 45%),
          linear-gradient(120deg, #efe5d2, #f7f1e8);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      .card {
        width: min(760px, 100%);
        background: color-mix(in srgb, var(--panel) 88%, white);
        border: 1px solid #eadcc6;
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 20px 60px rgba(71, 44, 26, 0.12);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.8rem, 3vw, 2.8rem);
        letter-spacing: 0.01em;
      }

      p {
        margin: 0 0 1.25rem;
        line-height: 1.6;
        color: var(--muted);
      }

      .pill {
        display: inline-block;
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #fff;
        font-size: 0.85rem;
        margin-bottom: 1rem;
      }

      .links {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-bottom: 1.25rem;
      }

      a {
        color: #fff;
        text-decoration: none;
        background: #5a301e;
        border-radius: 10px;
        padding: 0.55rem 0.8rem;
      }

      a:hover {
        background: #3f2215;
      }

      .uploader {
        border: 1px solid #eadcc6;
        border-radius: 12px;
        padding: 1rem;
        background: #fff;
      }

      .uploader label {
        display: block;
        margin-bottom: 0.45rem;
        font-weight: 700;
        color: #463224;
      }

      .uploader input,
      .uploader button {
        font: inherit;
      }

      .uploader input[type='file'] {
        width: 100%;
        margin-bottom: 0.8rem;
      }

      .uploader button {
        border: 0;
        border-radius: 10px;
        padding: 0.6rem 1rem;
        background: #5a301e;
        color: #fff;
        cursor: pointer;
      }

      .uploader button:hover {
        background: #3f2215;
      }

      .result {
        margin-top: 0.9rem;
        color: var(--muted);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="pill">Express App Ready</span>
      <h1>Photo Archive Workspace</h1>
      <p>
        The repository structure from the README has been created. Use this web app as a lightweight
        starting point for archive tooling and metadata workflows.
      </p>
      <div class="links">
        <a href="/api/health">Health API</a>
        <a href="/api/info">Project Info API</a>
      </div>

      <form class="uploader" id="uploadForm">
        <label for="photos">Upload one or more images</label>
        <input id="photos" name="photos" type="file" accept="image/*" multiple required />
        <button type="submit">Upload Images</button>
        <div class="result" id="result"></div>
      </form>
    </main>

    <script>
      const form = document.getElementById('uploadForm');
      const fileInput = document.getElementById('photos');
      const result = document.getElementById('result');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        if (!fileInput.files.length) {
          result.textContent = 'Please choose at least one image.';
          return;
        }

        const data = new FormData();
        for (const file of fileInput.files) {
          data.append('photos', file);
        }

        result.textContent = 'Uploading...';

        try {
          const response = await fetch('/api/upload', {
            method: 'POST',
            body: data
          });

          const payload = await response.json();
          if (!response.ok) {
            result.textContent = `Upload failed: ${payload.error || 'Unknown error'}`;
            return;
          }

          result.textContent = `Uploaded ${payload.count} file(s):\n${payload.files
            .map((f) => `${f.originalName} -> ${f.storedName}`)
            .join('\n')}`;
          form.reset();
        } catch (_err) {
          result.textContent = 'Network error while uploading files.';
        }
      });
    </script>
  </body>
</html>
